1. Prepare Your Vue.js Project
1. 准备你的 Vue.js 项目

Ensure your project is using a router in history mode. In your router/index.js file:
确保您的项目正在使用处于历史模式的路由器。在您的 router/index.js 文件中：

The history mode uses the browser’s history API to create cleaner URLs without the hash # symbol, normally if Vue Router is managing the URL, the url can look like http://example.com/#/about, but with history enabled, you can have routing like http://example.com/about 
历史模式使用浏览器的历史 API 来创建没有哈希 # 符号的更干净的 URL，通常如果 Vue Router 正在管理 URL，url 可能看起来像 http://example.com/#/about，但启用历史后，你可以像 http://example.com/about 一样进行路由

The BASE_URL is typically used to define the root path for your application, e.g. if your website is deployed at the root of your domain, then BASE_URL will be /. However if you created a folder called "Yiwei" and deploy your project within the folder, your base_URL will be /Yiwei/, details will be from official website, https://cli.vuejs.org/guide/mode-and-env.html#environment-variables 
BASE_URL通常用于定义应用程序的根路径，例如，如果您的网站部署在域的根目录中，则BASE_URL将为 /。但是，如果您创建了一个名为 “Yiwei” 的文件夹并在该文件夹中部署了您的项目，则您的base_URL将是 /Yiwei/，详细信息将来自官方网站，https://cli.vuejs.org/guide/mode-and-env.html#environment-variables


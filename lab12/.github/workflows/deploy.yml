Step 7: Access Your Deployed Application
第 7 步：访问已部署的应用程序
Once the workflow completes successfully, your app will be available at: https://<username>.github.io/<repository-name>/
工作流成功完成后，您的应用将在以下位置提供： https://<username>.github.io/<repository-name>/ 

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@4.1.4
      with:
        branch: gh-pages
        folder: dist

permissions:
  contents: write